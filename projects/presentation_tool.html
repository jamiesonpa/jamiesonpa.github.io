<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presentation Tool - jamiesonpa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="presentation-body">
    <div class="presentation-shell">
      <header class="presentation-header">
        <div class="presentation-title-row">
          <h1>Presentation Tool</h1>
          <a href="index.html" class="back-link">&larr; Back to projects</a>
        </div>
        <p class="presentation-blurb">
          Upload an MP4 and a timestamp text file, then start the presentation.
        </p>
      </header>

      <section id="presentation-setup" class="presentation-form">
        <div class="presentation-upload-grid">
          <label class="presentation-upload">
            <span>MP4 video</span>
            <input id="video-file" type="file" accept=".mp4,video/mp4" />
          </label>
          <label class="presentation-upload">
            <span>Timestamp TXT</span>
            <input id="timestamp-file" type="file" accept=".txt,text/plain" />
          </label>
        </div>

        <div class="presentation-actions">
          <button id="start-button" class="primary" type="button">Start</button>
          <span id="presentation-status" class="presentation-status">Upload an MP4 and timestamp file.</span>
        </div>
      </section>
    </div>

    <main id="presentation-stage" class="presentation-stage hidden" aria-label="Presentation player">
      <video id="presentation-video" preload="metadata" playsinline></video>
    </main>

    <script type="module" src="./js/presentation_tool.js?v=20260713-start-mode"></script>
  </body>
</html>
